name: Build CVs and publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile Typst files
        uses: lvignoli/typst-action@main
        with:
          source_file: |
            cv_es.typ
            cv_en.typ

      - name: Prepare site (landing page + PDFs)
        shell: bash
        run: |
          mkdir -p _site
          cp cv_es.pdf cv_en.pdf _site/
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>CV — Facundo Mello</title>
            <style>
              :root { color-scheme: light dark; }
              body {
                font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
                margin: 0; min-height: 100vh;
                display: flex; align-items: center; justify-content: center;
                background: #0f1115; color: #e8e8e8;
              }
              main { text-align: center; padding: 2rem; max-width: 560px; }
              h1 { font-size: 1.7rem; margin: 0 0 .4rem; }
              p.sub { color: #9aa0aa; margin: 0 0 1.8rem; }
              ul { list-style: none; padding: 0; margin: 0 0 1.6rem;
                   display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
              a.btn {
                display: inline-block; padding: .85rem 1.8rem; border-radius: 12px;
                background: #2563eb; color: #fff; text-decoration: none; font-weight: 600;
                border: 1px solid #3b82f6; transition: background .15s;
              }
              a.btn:hover { background: #1d4ed8; }
              p.foot { font-size: .85rem; color: #6b7280; }
              p.foot a { color: #93c5fd; }
            </style>
          </head>
          <body>
            <main>
              <h1>Facundo Octavio Mello</h1>
              <p class="sub">Estudiante de Desarrollo de Software · QA · Soporte IT</p>
              <ul>
                <li><a class="btn" href="cv_es.pdf">📄 CV en español</a></li>
                <li><a class="btn" href="cv_en.pdf">📄 CV in English</a></li>
              </ul>
              <p class="foot">
                Actualizado automáticamente con GitHub Actions ·
                <a href="https://github.com/facundomello34-byte/cv">repositorio</a>
              </p>
            </main>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
